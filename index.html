<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palestra">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2c2c36">
<title>Palestra</title>
<link rel="apple-touch-icon" sizes="180x180" href="icona.png?v=2">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
  html { background: #2c2c36; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 85% 0%, rgba(212, 255, 63, 0.18), transparent 42%), linear-gradient(180deg, #3d3d4a 0%, #2a2a34 100%);
    background-attachment: fixed;
    padding-bottom: calc(110px + env(safe-area-inset-bottom));
    padding-top: env(safe-area-inset-top);
  }
  main { padding: 20px; }
  h1 { font-size: 28px; margin: 8px 0 16px; }
  h2 { font-size: 20px; margin: 24px 0 8px; }
  .muted { color: #d4d4dc; font-size: 14px; margin: 4px 0; }
  .card { background: rgba(255, 255, 255, 0.14); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255, 255, 255, 0.22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.3); border-radius: 20px; padding: 16px; margin-bottom: 12px; }
  .between { display: flex; justify-content: space-between; align-items: center; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .grow { flex: 1; }
  .ex { display: flex; align-items: center; gap: 12px; }
  .pic { width: 52px; height: 52px; flex: none; fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; color: #d4ff3f; }
  .pic .base { stroke-width: 4; opacity: 0.35; }
  input { background: rgba(255, 255, 255, 0.18); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #fff; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 12px; padding: 10px 12px; font-size: 16px; min-width: 80px; }
  input::placeholder { color: #b0b0bb; }
  button { font: inherit; border: none; cursor: pointer; }
  .primary { display: block; width: 100%; background: linear-gradient(rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 55%), #d4ff3f; color: #0a0a0a; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 8px 24px rgba(212, 255, 63, 0.2); font-weight: 700; font-size: 16px; border-radius: 16px; padding: 14px; margin: 12px 0; }
  .small { background: rgba(255, 255, 255, 0.18); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff; font-weight: 600; border-radius: 12px; padding: 10px 14px; }
  .chip { background: rgba(255, 255, 255, 0.18); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff; font-weight: 600; border-radius: 999px; padding: 8px 14px; }
  .chip.on { background: #d4ff3f; color: #0a0a0a; border-color: #d4ff3f; }
  .chip.on.saltato { background: #f87171; border-color: #f87171; }
  .link { background: none; color: #f87171; font-size: 14px; padding: 0; }
  .badge { display: inline-block; color: #fff; font-weight: 700; border-radius: 999px; padding: 6px 14px; margin-bottom: 16px; }
  .badge.small { margin: 0; font-size: 13px; }
  .badge.pesi { color: #0a0a0a; }
  .pesi { background: #d4ff3f; }
  .cardio { background: #7cb9ff; color: #0a0a0a; }
  .riposo { background: #6e6e7a; }
  .timer { font-size: 56px; font-weight: 200; font-variant-numeric: tabular-nums; }
  .planrow { display: flex; justify-content: space-between; align-items: center; width: 100%; background: rgba(255, 255, 255, 0.14); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255, 255, 255, 0.22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.3); color: #fff; border-radius: 20px; padding: 16px; margin-bottom: 10px; font-size: 17px; }
  .check { display: flex; align-items: center; gap: 12px; width: 100%; background: none; color: #fff; text-align: left; font-size: 16px; padding: 8px 0; }
  .box { width: 24px; height: 24px; flex: none; border-radius: 7px; border: 2px solid rgba(255, 255, 255, 0.5); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; }
  .check.on .box { background: #d4ff3f; border-color: #d4ff3f; color: #0a0a0a; }
  .check .pic { width: 36px; height: 36px; }
  .help summary { color: #fff; font-weight: 600; padding: 6px 0; cursor: pointer; }
  .help ol { padding-left: 20px; margin: 8px 0 0; }
  .help li { margin-bottom: 12px; line-height: 1.4; }
  nav {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex;
    background: rgba(255, 255, 255, 0.18);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 26px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 10px 30px rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }
  nav button { flex: 1; background: none; color: rgba(255, 255, 255, 0.75); font-weight: 700; font-size: 12px; padding: 16px 0; }
  nav button.active { color: #d4ff3f; }
  .calhead { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 12px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { color: #d4d4dc; font-size: 12px; text-align: center; }
  .cal-cell { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 12px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; padding: 2px; }
  .cal-cell.empty { background: none; border: none; }
  .cal-cell.today { border-color: #d4ff3f; }
  .cal-cell.sel { background: rgba(255, 255, 255, 0.18); }
  .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 4px; }
  .dot.pesi { background: #d4ff3f; }
  .dot.cardio { background: #60a5fa; }
  .dot.planned { background: rgba(255, 255, 255, 0.3); }
  .x { color: #f87171; font-weight: 800; font-size: 14px; line-height: 1; margin-top: 3px; }
  .banner { border: 1px solid rgba(212, 255, 63, 0.45); }
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <button data-tab="oggi">OGGI</button>
  <button data-tab="pesi">PESI</button>
  <button data-tab="cardio">CARDIO</button>
  <button data-tab="cal">CAL</button>
  <button data-tab="piano">PIANO</button>
</nav>
<script>
  const DAYS = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
  const LABEL = { pesi: 'Pesi', cardio: 'Cardio', riposo: 'Riposo' };
  const LOG_LABEL = { pesi: 'Pesi fatto', cardio: 'Cardio fatto', saltato: 'Non andato' };
  const CYCLE = ['riposo', 'pesi', 'cardio'];
  const CARDIO_TYPES = ['Corsa', 'Bici', 'Ellittica', 'Nuoto', 'Camminata'];

  // Scheda pesi: serie e ripetizioni proposte (modificabili nel codice)
  const ROUTINE = [
    { name: 'Leg press', target: '3 × 10–12' },
    { name: 'Chest press', target: '3 × 10–12' },
    { name: 'Lat machine', target: '3 × 10–12' },
    { name: 'Leg curl', target: '3 × 10–12' },
    { name: 'Shoulder press', target: '3 × 10–12' },
    { name: 'Seated row', target: '3 × 10–12' },
    { name: 'Addominali', target: '3 × 15' },
  ];

  // Riscaldamento e defaticamento: checklist per ogni sessione
  const WARM = {
    pesi: ['Cardio leggero (5 min)', 'Mobilità dinamica (3–5 min): spalle, anche, schiena'],
    cardio: ['Cardio leggero 8 min', 'Allunghi dinamici (2 min)'],
  };
  const COOL = { pesi: '5–7 min di stretching leggero', cardio: '5–7 min a ritmo lento' };

  // Spiegazione di ogni esercizio di riscaldamento (10–15 ripetizioni per movimento, senza affaticarsi)
  const WARM_HELP = {
    pesi: [
      ['Cardio leggero (5 min)', 'Tapis roulant a passo veloce o cyclette a ritmo facile: devi riuscire a parlare senza fatica.'],
      ['Cerchi con le braccia (10 avanti, 10 indietro)', 'Braccia tese ai lati, fai cerchi piccoli che diventano più ampi. Scalda spalle e scapole.'],
      ['Oscillazioni delle gambe (10 per lato)', 'In piedi, con una mano di appoggio, oscilla la gamba avanti e indietro, poi di lato. Scalda anche e femorali.'],
      ['Squat a corpo libero (10 lenti)', 'Piedi alla larghezza delle spalle, scendi lentamente e risali. Scalda ginocchia e caviglie.'],
      ['Gatto-cammello (8 lenti)', 'A quattro zampe: inarca la schiena verso il basso e poi verso l\'alto, lentamente. Scalda la colonna.'],
      ['Rotazione del busto (6 per lato)', 'In piedi, braccia aperte, ruota il busto da una parte e dall\'altra tenendo il bacino fermo.'],
    ],
    cardio: [
      ['Cardio leggero (8 min)', 'Stesso ritmo facile del cardio: all\'inizio cammina, poi aumenta gradualmente.'],
      ['Oscillazioni delle gambe (10 per lato)', 'Come sopra: scalda anche e femorali prima degli intervalli.'],
      ['Allunghi dinamici (2 min): affondi', 'In piedi, fai un passo avanti con una gamba e piega entrambe le ginocchia, finché il ginocchio dietro si avvicina a terra senza toccarla. Spingi con il piede davanti per tornare su. Busto dritto. Fai 5 affondi per gamba, poi cambia gamba. Scalda quadricipiti e anche.'],
    ],
  };
  const warmupHelp = (type) => `
    <details class="help" open>
      <summary>Come si fa</summary>
      <ol>${WARM_HELP[type].map(([t, d]) => `<li><strong>${t}</strong><br><span class="muted">${d}</span></li>`).join('')}</ol>
    </details>`;

  // Pittogrammi: posizioni dell'esercizio (figura di profilo, rivolta a destra)
  const PIC_RUN = { head: [54, 14], lines: [[[54, 34], [48, 58]], [[48, 58], [38, 72], [30, 88]], [[48, 58], [62, 70], [72, 84]], [[54, 36], [42, 44], [34, 36]], [[54, 36], [66, 46], [72, 40]]], base: [[[10, 96], [90, 96]]] };
  const PIC_DEFAULT = { head: [50, 18], lines: [[[50, 34], [50, 60]], [[50, 60], [44, 84], [42, 96]], [[50, 60], [56, 84], [58, 96]], [[50, 38], [40, 54], [38, 64]], [[50, 38], [60, 54], [62, 64]]] };
  const PICS = {
    'Leg press': { head: [44, 24], lines: [[[44, 64], [44, 38]], [[44, 64], [70, 56], [88, 62]], [[44, 40], [36, 54], [38, 62]]], base: [[[30, 70], [60, 70]], [[84, 68], [96, 68]]] },
    'Chest press': { head: [44, 24], lines: [[[44, 64], [44, 38]], [[44, 64], [66, 64], [66, 84]], [[44, 40], [64, 40], [84, 40]]], base: [[[30, 70], [60, 70]]] },
    'Shoulder press': { head: [44, 24], lines: [[[44, 64], [44, 38]], [[44, 64], [66, 64], [66, 84]], [[44, 40], [32, 28], [30, 12]], [[44, 40], [58, 28], [62, 12]]], base: [[[30, 70], [60, 70]]] },
    'Seated row': { head: [44, 24], lines: [[[44, 64], [44, 38]], [[44, 64], [66, 64], [66, 84]], [[44, 40], [34, 46], [40, 54]]], base: [[[30, 70], [60, 70]], [[62, 44], [78, 44]]] },
    'Lat machine': { head: [50, 20], lines: [[[50, 56], [50, 34]], [[50, 56], [46, 76], [44, 94]], [[50, 56], [56, 76], [58, 94]], [[50, 36], [34, 44], [38, 20]], [[50, 36], [66, 44], [62, 20]]], base: [[[26, 6], [74, 6]]] },
    'Leg curl': { head: [20, 44], lines: [[[30, 50], [52, 50]], [[52, 50], [72, 50], [84, 38]], [[32, 50], [26, 60], [36, 60]]], base: [[[14, 58], [90, 58]]] },
    'Addominali': { head: [36, 58], lines: [[[66, 78], [44, 66]], [[66, 78], [80, 64], [90, 80]], [[44, 66], [38, 54], [46, 50]]], base: [[[14, 82], [92, 82]]] },
  };
  const pic = (p) => {
    const pts = (l) => l.map((q) => q.join(',')).join(' ');
    const base = (p.base || []).map((l) => `<polyline class="base" points="${pts(l)}"/>`).join('');
    const lines = p.lines.map((l) => `<polyline points="${pts(l)}"/>`).join('');
    return `<svg class="pic" viewBox="0 0 100 100" aria-hidden="true">${base}<circle cx="${p.head[0]}" cy="${p.head[1]}" r="7"/>${lines}</svg>`;
  };
  const picFor = (name) => pic(PICS[name] || PIC_DEFAULT);

  // Settimana A: 2 cardio + 1 pesi. Settimana B: 2 pesi + 1 cardio. Lun = 0
  const DEFAULT = {
    plans: {
      A: ['cardio', 'riposo', 'pesi', 'riposo', 'cardio', 'riposo', 'riposo'],
      B: ['pesi', 'riposo', 'cardio', 'riposo', 'pesi', 'riposo', 'riposo'],
    },
    swap: false,              // inverte A/B se la settimana corrente non corrisponde
    cardioMode: 'intervalli', // 'intervalli' oppure 'continuo'
    exercises: ROUTINE.map((r) => r.name),
    sets: [],
    cardio: [],
    log: {},     // { 'YYYY-MM-DD': 'pesi' | 'cardio' | 'saltato' }
    checks: {},  // { 'YYYY-MM-DD': { 'pesi-w0': true, ... } } riscaldamento e defaticamento
    payments: {}, // { 'YYYY-MM': 'YYYY-MM-DD' (data in cui è stato pagato) }
  };
  const KEY = 'palestra:v2';

  let data = load();
  let tab = 'oggi';
  let cardioType = CARDIO_TYPES[0];
  let draft = {};        // bozze dei campi pesi (per indice esercizio) e cardio
  let timer = { left: 0, id: null };

  function load() {
    try {
      return { ...structuredClone(DEFAULT), ...JSON.parse(localStorage.getItem(KEY) || '{}') };
    } catch (e) {
      return structuredClone(DEFAULT);
    }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

  const todayIdx = () => (new Date().getDay() + 6) % 7; // Lunedì = 0
  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Numero della settimana ISO, usato per alternare A e B
  function isoWeek(date) {
    const t = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  }
  function currentWeek() {
    return (isoWeek(new Date()) + (data.swap ? 1 : 0)) % 2 === 0 ? 'A' : 'B';
  }
  const targetOf = (name) => (ROUTINE.find((r) => r.name === name) || {}).target || '';
  const section = (title, inner) => `<h2>${title}</h2><div class="card">${inner}</div>`;
  const checkRow = (key, label, done, icon = '') =>
    `<button class="check ${done[key] ? 'on' : ''}" data-check="${key}"><span class="box">${done[key] ? '✓' : ''}</span>${icon}<span>${label}</span></button>`;

  // ---------- OGGI (panoramica con sotto-schede Cardio e Pesi) ----------
  let oggiTab = null; // null = automatico, in base all'allenamento del giorno

  // Sotto-scheda predefinita: allenamento di oggi, altrimenti il prossimo
  function defaultOggiTab() {
    const today = plannedFor(todayISO());
    if (today !== 'riposo') return today;
    for (let i = 1; i <= 7; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      const t = plannedFor(isoOf(d.getFullYear(), d.getMonth(), d.getDate()));
      if (t !== 'riposo') return t;
    }
    return 'pesi';
  }

  function cardioView(done) {
    const mode = data.cardioMode;
    return `
      ${section('Riscaldamento', WARM.cardio.map((x, i) => checkRow(`cardio-w${i}`, x, done)).join('') + warmupHelp('cardio'))}
      <h2>Parte centrale</h2>
      <div class="card">
        <div class="ex">${pic(PIC_RUN)}<strong>${mode === 'intervalli' ? '3 × (3 min sostenuti + 2 min lenti)' : '30 min sostenuti'}</strong></div>
        <div class="row">
          <button class="chip ${mode === 'intervalli' ? 'on' : ''}" data-mode="intervalli">3 × intervalli</button>
          <button class="chip ${mode === 'continuo' ? 'on' : ''}" data-mode="continuo">30 min continui</button>
        </div>
      </div>
      ${section('Defaticamento', checkRow('cardio-d0', COOL.cardio, done))}
      <button class="primary" data-go="cardio">Registra sessione cardio</button>`;
  }

  // Carico di lavoro più recente per esercizio, dalle serie registrate
  const lastWork = (name) => {
    const s = [...data.sets].reverse().find((x) => x.exercise === name);
    return s ? s.kg : null;
  };
  const roundKg = (kg) => Math.round(kg / 2.5) * 2.5; // i dischi arrivano a 2,5 kg
  // Carico di avvicinamento: percentuale del carico di lavoro, oppure la percentuale se manca lo storico
  function approachLoad(name, p) {
    const kg = lastWork(name);
    return kg == null
      ? `${Math.round(p * 100)}% del carico di lavoro`
      : `${roundKg(kg * p)} kg`;
  }

  function pesiView(done) {
    const first = data.exercises[0];
    const ramp = [[0.5, '8–10'], [0.7, '4–6'], [0.85, '2–3']];
    return `
      ${section('Riscaldamento', `
        ${WARM.pesi.map((x, i) => checkRow(`pesi-w${i}`, x, done)).join('')}
        ${warmupHelp('pesi')}
        ${first ? `<p class="muted">${esc(first)}, serie di avvicinamento con peso crescente:</p>` : ''}
        ${first ? ramp.map(([p, reps], i) => checkRow(`pesi-r${i}`, `${approachLoad(first, p)} × ${reps} rip.`, done)).join('') : ''}
        <p class="muted">Riposa 30–60 secondi tra una serie e l'altra.</p>`)}
      <h2>Esercizi</h2>
      ${data.exercises.map((name) => `
        <div class="card ex">${picFor(name)}<div>
          <strong>${esc(name)}</strong>
          <p class="muted">Obiettivo: ${targetOf(name)}</p>
          ${name !== first ? `<p class="muted">Avvicinamento: ${approachLoad(name, 0.5)} × 8–10 rip.</p>` : ''}
        </div></div>`).join('')}
      ${section('Defaticamento', checkRow('pesi-d0', COOL.pesi, done))}
      <button class="primary" data-go="pesi">Apri scheda pesi</button>`;
  }

  function oggi() {
    const w = currentWeek();
    const t = data.plans[w][todayIdx()];
    const today = todayISO();
    const done = data.checks[today] || {};
    const skipped = data.log[today] === 'saltato';
    const active = oggiTab || defaultOggiTab();
    const note = t === 'riposo' ? '<p class="muted">Oggi è riposo: ti mostro il prossimo allenamento.</p>' : '';
    const skip = t !== 'riposo'
      ? `<button class="small" data-skip="1">${skipped ? 'Annulla “non sono andato”' : 'Non sono andato oggi'}</button>`
      : '';
    return `
      <h1>Oggi, ${DAYS[todayIdx()]}</h1>
      <p class="muted">Settimana ${w} · Programmato: ${LABEL[t]}</p>
      ${note}
      <div class="row">
        <button class="chip ${active === 'cardio' ? 'on' : ''}" data-otab="cardio">Cardio</button>
        <button class="chip ${active === 'pesi' ? 'on' : ''}" data-otab="pesi">Pesi</button>
      </div>
      ${active === 'cardio' ? cardioView(done) : pesiView(done)}
      ${skip}
      <h2>Timer di recupero</h2>
      <div class="timer" id="timer">${fmt(timer.left)}</div>
      <div class="row">
        ${[60, 90, 120].map((s) => `<button class="small" data-rest="${s}">${s}s</button>`).join('')}
        ${timer.id ? `<button class="small" data-stop="1">Stop</button>` : ''}
      </div>`;
  }
  function startRest(sec) {
    stopRest(false);
    timer.left = sec;
    timer.id = setInterval(() => {
      timer.left--;
      if (timer.left <= 0) {
        stopRest(true);
      } else {
        const el = document.getElementById('timer');
        if (el) el.textContent = fmt(timer.left);
      }
    }, 1000);
    render();
  }
  function stopRest(finished) {
    clearInterval(timer.id);
    timer.id = null;
    timer.left = 0;
    if (finished && navigator.vibrate) navigator.vibrate([300, 150, 300]);
    if (finished) render();
  }

  // ---------- PESI ----------
  function pesi() {
    const cards = data.exercises.map((name, i) => {
      const last = [...data.sets].reverse().find((s) => s.exercise === name);
      const d = draft[i] || { kg: '', reps: '' };
      const target = targetOf(name);
      return `
        <div class="card">
          <div class="between">
            <div class="ex">${picFor(name)}<strong>${esc(name)}</strong></div>
            <button class="link" data-remove="${i}">Rimuovi</button>
          </div>
          ${target ? `<p class="muted">Obiettivo: ${target}</p>` : ''}
          ${last ? `<p class="muted">Ultima volta: ${last.kg} kg × ${last.reps} (${fmtDate(last.date)})</p>` : ''}
          <div class="row">
            <input inputmode="decimal" placeholder="kg" value="${esc(d.kg)}" data-draft="${i}" data-field="kg">
            <input inputmode="numeric" placeholder="rip." value="${esc(d.reps)}" data-draft="${i}" data-field="reps">
            <button class="small" data-save="${i}">Salva</button>
          </div>
        </div>`;
    }).join('');
    return `
      <h1>Scheda pesi</h1>
      ${cards}
      <div class="row">
        <input id="newEx" class="grow" placeholder="Nuovo esercizio">
        <button class="small" data-add="1">Aggiungi</button>
      </div>
      <h2>Storico serie</h2>
      ${data.sets.length ? [...data.sets].map((s, idx) => ({ ...s, idx })).reverse().slice(0, 50).map((s) => `
        <div class="card">
          <div class="between">
            <div><strong>${esc(s.exercise)}</strong><p class="muted">${s.kg} kg × ${s.reps} rip. · ${fmtDate(s.date)}</p></div>
            <div class="row">
              <button class="small" data-editset="${s.idx}">Modifica</button>
              <button class="link" data-delset="${s.idx}">Elimina</button>
            </div>
          </div>
        </div>`).join('') : '<p class="muted">Nessuna serie registrata.</p>'}`;
  }

  // ---------- CARDIO ----------
  function cardio() {
    const dr = draft.cardio || { min: '', km: '' };
    const chips = CARDIO_TYPES.map((t) =>
      `<button class="chip ${t === cardioType ? 'on' : ''}" data-ctype="${t}">${t}</button>`).join('');
    const hist = data.cardio.length
      ? data.cardio.map((c, idx) => `
          <div class="card">
            <div class="between">
              <div>
                <strong>${esc(c.type)} · ${c.minutes} min${c.km > 0 ? ` · ${c.km} km` : ''}</strong>
                <p class="muted">${fmtDate(c.date)}</p>
              </div>
              <div class="row">
                <button class="small" data-editcardio="${idx}">Modifica</button>
                <button class="link" data-delcardio="${idx}">Elimina</button>
              </div>
            </div>
          </div>`).join('')
      : '<p class="muted">Nessuna sessione registrata.</p>';
    return `
      <h1>Cardio</h1>
      <div class="row">${chips}</div>
      <div class="row">
        <input inputmode="numeric" placeholder="Minuti" value="${esc(dr.min)}" data-cdraft="min">
        <input inputmode="decimal" placeholder="Km (facoltativi)" value="${esc(dr.km)}" data-cdraft="km">
      </div>
      <button class="primary" data-csave="1">Salva sessione</button>
      <h2>Storico</h2>
      ${hist}`;
  }

  // ---------- PIANO ----------
  function pianoSettimana(w) {
    return `
      <h2>Settimana ${w}</h2>
      ${DAYS.map((d, i) => `
        <button class="planrow" data-toggle="${w}:${i}">
          <strong>${d}</strong>
          <span class="badge small ${data.plans[w][i]}">${LABEL[data.plans[w][i]]}</span>
        </button>`).join('')}`;
  }
  function piano() {
    return `
      <h1>Piano settimanale</h1>
      <p class="muted">Questa settimana è la <strong>${currentWeek()}</strong>.</p>
      <button class="small" data-swap="1">Scambia A e B</button>
      <p class="muted">Tocca un giorno per cambiarne il tipo.</p>
      ${pianoSettimana('A')}
      ${pianoSettimana('B')}
      <p class="muted">Settimana A: 2 giorni di cardio e 1 di pesi. Settimana B: 2 giorni di pesi e 1 di cardio.</p>
      <h2>Backup</h2>
      <div class="card">
        <p class="muted">I dati restano nel browser di questo dispositivo. Esporta ogni tanto un file di backup, e importalo se cambi telefono o browser.</p>
        <div class="row">
          <button class="small" data-export="1">Esporta backup</button>
          <button class="small" data-import="1">Importa backup</button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" style="display: none">
      </div>`;
  }

  // ---------- CALENDARIO E PAGAMENTI ----------
  let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  let calSelected = todayISO();
  const ymOf = (iso) => iso.slice(0, 7);
  const isoOf = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const fmtDate = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;
  const monthName = (d) => d.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });

  // Tipo di giornata programmato per una data, rispettando la settimana A/B
  function plannedFor(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const week = (isoWeek(date) + (data.swap ? 1 : 0)) % 2 === 0 ? 'A' : 'B';
    return data.plans[week][(date.getDay() + 6) % 7];
  }

  // Banner da 7 giorni prima (dal 25) fino al 2 del mese, finché il pagamento non è segnato
  function paymentBanner() {
    const now = new Date();
    const day = now.getDate();
    if (day > 2 && day < 25) return '';
    let target = ymOf(todayISO());
    let text = 'Oggi si paga la palestra (1 o 2 del mese).';
    if (day >= 25) {
      const first = new Date(now.getFullYear(), now.getMonth() + 1, 1);
      target = `${first.getFullYear()}-${String(first.getMonth() + 1).padStart(2, '0')}`;
      const days = Math.round((first - new Date(now.getFullYear(), now.getMonth(), day)) / 86400000);
      text = days === 1
        ? 'Domani si paga la palestra (1 o 2 del mese).'
        : `Tra ${days} giorni si paga la palestra (1 o 2 del mese).`;
    }
    if (data.payments[target]) return '';
    return `
      <div class="card banner">
        <strong>Pagamento palestra</strong>
        <p class="muted">${text}</p>
        <button class="small" data-paidm="${target}">Segna pagato</button>
      </div>`;
  }

  function calScreen() {
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    const offset = (new Date(y, m, 1).getDay() + 6) % 7;
    const total = new Date(y, m + 1, 0).getDate();
    const todayStr = todayISO();
    let cells = '';
    for (let i = 0; i < offset; i++) cells += '<div class="cal-cell empty"></div>';
    for (let d = 1; d <= total; d++) {
      const iso = isoOf(y, m, d);
      const logged = data.log[iso];
      const mark = logged === 'saltato' ? '<span class="x">✕</span>'
        : logged ? `<span class="dot ${logged}"></span>`
        : plannedFor(iso) !== 'riposo' ? '<span class="dot planned"></span>' : '<span class="dot"></span>';
      cells += `<button class="cal-cell ${iso === calSelected ? 'sel' : ''} ${iso === todayStr ? 'today' : ''}" data-calday="${iso}">${d}${mark}</button>`;
    }
    const vym = `${y}-${String(m + 1).padStart(2, '0')}`;
    const paid = data.payments[vym];
    const type = data.log[calSelected];
    return `
      <h1>Calendario</h1>
      <div class="calhead">
        <button class="small" data-calprev="1">‹</button>
        <strong style="text-transform: capitalize">${monthName(calMonth)}</strong>
        <button class="small" data-calnext="1">›</button>
      </div>
      <div class="cal-grid">
        ${['L', 'M', 'M', 'G', 'V', 'S', 'D'].map((l) => `<div class="cal-dow">${l}</div>`).join('')}
        ${cells}
      </div>
      <p class="muted">Pallino pieno: allenamento fatto. Pallino chiaro: programmato. ✕: non andato.</p>
      <div class="card">
        <strong>${fmtDate(calSelected)}</strong>
        <p class="muted">Programmato: ${LABEL[plannedFor(calSelected)]}</p>
        <div class="row">
          ${['pesi', 'cardio', 'saltato'].map((t) => `<button class="chip ${type === t ? 'on' : ''} ${t}" data-log="${t}">${LOG_LABEL[t]}</button>`).join('')}
        </div>
      </div>
      <h2>Pagamento palestra</h2>
      <div class="card">
        <strong style="text-transform: capitalize">${monthName(calMonth)}</strong>
        <p class="muted">${paid ? 'Pagato il ' + fmtDate(paid) : 'Non ancora pagato'}</p>
        <div class="row">
          ${paid
            ? `<button class="small" data-unpaid="${vym}">Annulla pagamento</button>`
            : `<button class="primary" data-paidm="${vym}">Segna pagato</button>`}
        </div>
      </div>
      <p class="muted">Il banner compare in tutte le schede dal 25 del mese fino al 2, finché il pagamento non è segnato.</p>`;
  }

  // ---------- RENDER E EVENTI ----------
  function render() {
    document.getElementById('app').innerHTML = paymentBanner() +
      (tab === 'oggi' ? oggi() : tab === 'pesi' ? pesi() : tab === 'cardio' ? cardio() : tab === 'cal' ? calScreen() : piano());
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;

    if (d.tab || d.go) { tab = d.tab || d.go; return render(); }
    if (d.rest) return startRest(Number(d.rest));
    if (d.stop) { stopRest(false); return render(); }
    if (d.mode) { data.cardioMode = d.mode; save(); return render(); }
    if (d.otab) { oggiTab = d.otab; return render(); }
    if (d.check) {
      const k = todayISO();
      data.checks[k] = data.checks[k] || {};
      data.checks[k][d.check] = !data.checks[k][d.check];
      save();
      return render();
    }
    if (d.skip !== undefined) {
      const k = todayISO();
      if (data.log[k] === 'saltato') delete data.log[k];
      else data.log[k] = 'saltato';
      save();
      return render();
    }

    if (d.save !== undefined) {
      const i = Number(d.save);
      const dr = draft[i] || {};
      const kg = parseFloat(String(dr.kg || '').replace(',', '.'));
      const reps = parseInt(dr.reps, 10);
      if (isNaN(kg) || isNaN(reps)) return alert('Inserisci kg e ripetizioni');
      data.sets.push({ date: todayISO(), exercise: data.exercises[i], kg, reps });
      delete draft[i];
      save();
      return render();
    }
    if (d.remove !== undefined) {
      data.exercises.splice(Number(d.remove), 1);
      draft = {};
      save();
      return render();
    }
    if (d.add) {
      const v = document.getElementById('newEx').value.trim();
      if (!v || data.exercises.includes(v)) return;
      data.exercises.push(v);
      save();
      return render();
    }

    if (d.ctype) { cardioType = d.ctype; return render(); }
    if (d.csave) {
      const dr = draft.cardio || {};
      const min = parseInt(dr.min, 10);
      if (isNaN(min) || min <= 0) return alert('Inserisci i minuti');
      data.cardio.unshift({
        date: todayISO(),
        type: cardioType,
        minutes: min,
        km: parseFloat(String(dr.km || '').replace(',', '.')) || 0,
      });
      draft.cardio = null;
      save();
      return render();
    }

    if (d.toggle !== undefined) {
      const [w, i] = d.toggle.split(':');
      data.plans[w][Number(i)] = CYCLE[(CYCLE.indexOf(data.plans[w][Number(i)]) + 1) % CYCLE.length];
      save();
      return render();
    }
    if (d.swap) { data.swap = !data.swap; save(); return render(); }

    if (d.editset !== undefined) {
      const s = data.sets[Number(d.editset)];
      const kg = prompt('Carico (kg)', s.kg);
      if (kg === null) return;
      const reps = prompt('Ripetizioni', s.reps);
      if (reps === null) return;
      const k = parseFloat(String(kg).replace(',', '.'));
      const r = parseInt(reps, 10);
      if (isNaN(k) || isNaN(r)) return alert('Valori non validi');
      s.kg = k;
      s.reps = r;
      save();
      return render();
    }
    if (d.delset !== undefined) {
      if (!confirm('Eliminare questa serie?')) return;
      data.sets.splice(Number(d.delset), 1);
      save();
      return render();
    }
    if (d.editcardio !== undefined) {
      const c = data.cardio[Number(d.editcardio)];
      const min = prompt('Minuti', c.minutes);
      if (min === null) return;
      const km = prompt('Km (0 se non li hai)', c.km);
      if (km === null) return;
      const m = parseInt(min, 10);
      if (isNaN(m) || m <= 0) return alert('Minuti non validi');
      c.minutes = m;
      c.km = parseFloat(String(km).replace(',', '.')) || 0;
      save();
      return render();
    }
    if (d.delcardio !== undefined) {
      if (!confirm('Eliminare questa sessione?')) return;
      data.cardio.splice(Number(d.delcardio), 1);
      save();
      return render();
    }

    if (d.export !== undefined) {
      const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = `palestra-backup-${todayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      return;
    }
    if (d.import !== undefined) { document.getElementById('importFile').click(); return; }

    if (d.calprev !== undefined) { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); return render(); }
    if (d.calnext !== undefined) { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); return render(); }
    if (d.calday) { calSelected = d.calday; return render(); }
    if (d.log) {
      if (data.log[calSelected] === d.log) delete data.log[calSelected];
      else data.log[calSelected] = d.log;
      save();
      return render();
    }
    if (d.paid !== undefined || d.paidm) {
      data.payments[d.paidm || ymOf(todayISO())] = todayISO();
      save();
      return render();
    }
    if (d.unpaid) { delete data.payments[d.unpaid]; save(); return render(); }
  });

  // Importa un backup: sostituisce i dati attuali con quelli del file
  document.addEventListener('change', (e) => {
    if (e.target.id !== 'importFile') return;
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.exercises) || !parsed.plans) throw new Error('formato');
        data = { ...structuredClone(DEFAULT), ...parsed };
        save();
        render();
        alert('Backup importato.');
      } catch (err) {
        alert('File non valido: scegli un backup esportato da questa app.');
      }
    };
    reader.readAsText(file);
  });

  // Salva le bozze mentre si scrive, senza ridisegnare la pagina
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.draft !== undefined) {
      const i = t.dataset.draft;
      draft[i] = { ...(draft[i] || { kg: '', reps: '' }), [t.dataset.field]: t.value };
    } else if (t.dataset.cdraft !== undefined) {
      draft.cardio = { ...(draft.cardio || { min: '', km: '' }), [t.dataset.cdraft]: t.value };
    }
  });

  render();
</script>
</body>
</html>
